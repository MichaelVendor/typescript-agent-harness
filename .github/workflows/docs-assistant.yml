name: Docs assistant

# Answers each new issue, and each /ask comment from the issue author or a collaborator, from the docs
# with a tah agent (.github/docs-assistant). Needs the repository secret DEEPSEEK_API_KEY.

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: docs-assistant-${{ github.event.issue.number }}

jobs:
  answer:
    if: >-
      (github.event_name == 'issues' && github.event.issue.user.type != 'Bot') ||
      (github.event_name == 'issue_comment' && !github.event.issue.pull_request &&
       github.event.comment.user.type != 'Bot' && startsWith(github.event.comment.body, '/ask') &&
       (github.event.comment.user.login == github.event.issue.user.login ||
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .github/docs-assistant
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .github/docs-assistant/package-lock.json

      - run: npm ci

      # Issue text comes in through env only: interpolating it into the script would let it run commands.
      # The prompt goes to tah run as one argument, which Linux caps at 128 KB, hence the cuts.
      - name: Build the prompt
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          printf '# %s\n\n%s\n' "$ISSUE_TITLE" "${ISSUE_BODY:0:6000}" > prompt.md
          if [ -n "$COMMENT_ID" ]; then
            printf '\n## 之前的评论\n\n' >> prompt.md
            gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100" \
              --jq '[.[] | select(.id != (env.COMMENT_ID | tonumber))] | .[-10:][] | "**@\(.user.login)**：\n\n\(.body[:2000])\n"' >> prompt.md
            question=${COMMENT_BODY#/ask}
            printf '\n## 追问（@%s）\n\n%s\n' "$COMMENT_AUTHOR" "${question:0:2000}" >> prompt.md
          fi

      - name: Ask the agent
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          npx tah run --quiet --no-persist --max-steps 12 "$(cat prompt.md)" > reply.md
          test -s reply.md

      - name: Comment
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          printf '\n\n---\n<sub>🤖 tah 文档助手根据文档自动回复，可能有误；维护者会跟进。issue 作者在评论里写 <code>/ask 你的问题</code> 可以继续追问。</sub>\n' >> reply.md
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file reply.md
